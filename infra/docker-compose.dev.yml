version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: projectplanning
      POSTGRES_USER: projectplanning
      POSTGRES_PASSWORD: projectplanning
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projectplanning -d projectplanning"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ../local-bff
      dockerfile: Dockerfile
    env_file:
      - ../local-bff/.env
    ports:
      - "8000:8000"
    volumes:
      - ../local-bff:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["--reload"]
    depends_on:
      db:
        condition: service_healthy

  # Frontend
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:

networks:
  default:
    driver: bridge
