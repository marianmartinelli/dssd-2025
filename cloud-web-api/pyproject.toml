[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "projectplanning-backend"
version = "0.1.0"
description = "FastAPI backend for ProjectPlanning academic project"
authors = [{ name = "Equipo DSSD 2025" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.114.2",
  "uvicorn[standard]>=0.30.6",
  "sqlalchemy>=2.0.35",
  "asyncpg>=0.29.0",
  "psycopg2-binary>=2.9.9",
  "alembic>=1.13.3",
  "pydantic>=2.9.1",
  "pydantic-settings>=2.4.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "httpx>=0.27.2",
  "python-multipart>=0.0.9",
  "structlog>=24.2.0"
]

[project.optional-dependencies]
test = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "factory-boy>=3.3.0"
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=app --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
